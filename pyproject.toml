[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taatik"
version = "1.0.0"
description = "Private, offline Hebrew transcription for Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.10"]

[project.gui-scripts]
taatik = "taatik.app:main"

[tool.setuptools.packages.find]
include = ["taatik*"]

